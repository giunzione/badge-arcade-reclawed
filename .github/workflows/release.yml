name: Release

# Builds every patches/*.toml and attaches to a GitHub Release:
#   - one ready-to-extract zip per region (badge-arcade-reclawed-<REGION>-<tag>.zip);
#   - the installer app, reclawed-installer.cia and .3dsx, with every patch bundled.
#     These names never change, so .../releases/latest/download/reclawed-installer.cia
#     (the QR code in the README) always gets the newest one. Note that "latest"
#     skips pre-releases: the QR code only finds full releases.
#
# Two ways to trigger it:
#   1. From the browser: Releases -> "Draft a new release" -> create a tag (e.g. v0.1.0-beta)
#      -> Publish. The zip is attached automatically a minute later.
#   2. From a terminal:  git tag v0.1.0-beta && git push origin v0.1.0-beta
#      (creates the release itself; tags containing a hyphen become pre-releases)

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

# A release created in the browser can fire both triggers: run them one at a time.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build all regions
        run: .github/scripts/build_all.sh "$GITHUB_REF_NAME"

      # Release created in the browser: attach the zip to it.
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.zip
          overwrite_files: true

      # Tag pushed from a terminal: create the release.
      - if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true

      # The built patches, for the installer job below.
      - uses: actions/upload-artifact@v4
        with:
          name: release-patches
          path: build/
          if-no-files-found: error

  installer:
    # Builds the installer with the patches above, in devkitPro's image, and
    # attaches it to the same release (which exists by now in both cases).
    needs: release
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-patches
          path: build/

      - name: Build the installer
        run: .github/scripts/build_installer.sh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/reclawed-installer.*
          overwrite_files: true
