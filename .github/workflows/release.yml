name: Release

# Builds every patches/*.toml and attaches one ready-to-extract zip per region
# (badge-arcade-reclawed-<REGION>-<tag>.zip) to a GitHub Release.
#
# Two ways to trigger it:
#   1. From the browser: Releases -> "Draft a new release" -> create a tag (e.g. v0.1.0-beta)
#      -> Publish. The zip is attached automatically a minute later.
#   2. From a terminal:  git tag v0.1.0-beta && git push origin v0.1.0-beta
#      (creates the release itself; tags containing a hyphen become pre-releases)

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

# A release created in the browser can fire both triggers: run them one at a time.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build all regions
        run: .github/scripts/build_all.sh "$GITHUB_REF_NAME"

      # Release created in the browser: attach the zip to it.
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.zip
          overwrite_files: true

      # Tag pushed from a terminal: create the release.
      - if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
