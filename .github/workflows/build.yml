name: Build patch

# Builds every patch definition in patches/*.toml on each push to main and on
# pull requests. The status shows up as a check on each commit and as the README badge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check scripts compile
        run: python -m py_compile tools/*.py

      - name: Build all regions
        run: .github/scripts/build_all.sh

      - name: Installer unit tests
        run: make -C installer/tests

      - name: SpotPass week tests (build_ips.py --spotpass)
        run: python tools/test_spotpass_week.py

      - name: Variable override smoke test
        run: |
          for f in patches/*.toml; do
            python tools/build_ips.py --patch "$f" --set plays=99 --out "/tmp/smoke/$(basename "$f" .toml).ips"
          done

      - name: Validate IPS structure
        run: |
          python - <<'PY'
          import pathlib
          files = list(pathlib.Path("build").rglob("*.ips"))
          assert files, "no IPS produced"
          for p in files:
              d = p.read_bytes()
              assert d[:5] == b"PATCH" and d[-3:] == b"EOF", f"{p}: bad header/footer"
              i, n = 5, 0
              while d[i:i+3] != b"EOF":
                  size = int.from_bytes(d[i+3:i+5], "big")
                  assert size > 0, f"{p}: RLE/empty record not expected"
                  i += 5 + size
                  n += 1
              assert i == len(d) - 3, f"{p}: trailing data"
              # One settings block, written per console by the installer. As
              # built: no anchor, built-in machines (works on any console).
              assert d.count(b"RCLWCFG1") == 1, f"{p}: expected exactly one settings block"
              at = d.index(b"RCLWCFG1") + 8
              assert d[at:at + 12] == bytes(8) + (1).to_bytes(4, "little"), f"{p}: settings block not at its default"
              print(f"{p}: OK, {n} records, {len(d)} bytes")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: badge-arcade-reclawed-${{ github.sha }}
          path: |
            dist/*.zip
            dist/patches.txt
            dist/patch-*.ips
          if-no-files-found: error

      # The built patches, for the installer job below.
      - uses: actions/upload-artifact@v4
        with:
          name: patches-${{ github.sha }}
          path: build/
          if-no-files-found: error

  installer:
    # Builds the installer app (.cia and .3dsx) with the patches from the build
    # job, in devkitPro's own image (devkitARM, libctru, citro2d).
    needs: build
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: patches-${{ github.sha }}
          path: build/

      - name: Build the installer
        run: .github/scripts/build_installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: reclawed-installer-${{ github.sha }}
          path: dist/reclawed-installer.*
          if-no-files-found: error
